<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — EduVance Academy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a2e; --ink-mid: #2d2d4e; --ink-soft: #5a5a7a; --ink-muted: #9898b3;
      --accent: #c8a96e; --accent-dim: rgba(200,169,110,0.15);
      --surface: #faf9f7; --surface-2: #f2f0ec; --white: #ffffff;
      --border: #e4e0d8; --radius: 14px; --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(26,26,46,0.08); --shadow-lg: 0 12px 48px rgba(26,26,46,0.14);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--ink); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(26,26,46,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(200,169,110,0.12); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: var(--white); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-back { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
    .nav-back:hover { color: var(--accent); }

    /* MAIN */
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5rem 1.5rem 3rem; position: relative; }
    .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(200,169,110,0.07) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
    .bg-circle { position: absolute; border-radius: 50%; border: 1px solid rgba(200,169,110,0.08); pointer-events: none; }
    .bg-circle:nth-child(2) { width: 500px; height: 500px; top: -150px; right: -150px; }
    .bg-circle:nth-child(3) { width: 300px; height: 300px; bottom: -80px; left: -80px; }

    .login-box { background: var(--white); border-radius: var(--radius); padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); position: relative; z-index: 1; }
    .login-eyebrow { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 0.4rem; }
    .login-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 0.4rem; }
    .login-title em { font-style: italic; color: var(--accent); }
    .login-sub { font-size: 13.5px; color: var(--ink-soft); font-weight: 300; margin-bottom: 2rem; line-height: 1.6; }

    /* Google btn */
    .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: var(--white); border: 1.5px solid var(--border); border-radius: 999px; padding: 0.85rem 1.5rem; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem; }
    .btn-google:hover { border-color: var(--ink); background: var(--surface); transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Divider */
    .divider { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 12px; color: var(--ink-muted); font-weight: 500; white-space: nowrap; }

    /* Tabs */
    .auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1.5px solid var(--border); border-radius: 999px; padding: 3px; }
    .auth-tab { flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 0.5rem; border-radius: 999px; cursor: pointer; transition: all 0.2s; color: var(--ink-muted); border: none; background: transparent; font-family: 'DM Sans', sans-serif; }
    .auth-tab.active { background: var(--ink); color: var(--accent); }

    /* Form */
    .auth-panel { display: none; }
    .auth-panel.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-mid); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 0.95rem; transition: all 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--accent); background: var(--white); box-shadow: 0 0 0 3px var(--accent-dim); }
    .btn-submit { width: 100%; background: var(--accent); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; padding: 0.9rem; border-radius: 999px; border: none; cursor: pointer; transition: all 0.25s; margin-top: 0.25rem; }
    .btn-submit:hover { background: #d4b87a; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(200,169,110,0.35); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Error / success */
    .auth-msg { font-size: 13px; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; display: none; }
    .auth-error { background: rgba(212,112,90,0.1); border: 1px solid rgba(212,112,90,0.3); color: #b85a44; }
    .auth-success { background: rgba(93,186,114,0.1); border: 1px solid rgba(93,186,114,0.3); color: #4a9c5d; }

    .login-footer { text-align: center; margin-top: 1.5rem; font-size: 12.5px; color: var(--ink-muted); }
    .login-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

    @media (max-width: 480px) { .login-box { padding: 1.75rem; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Edu<span>Vance</span></a>
  <a href="index.html" class="nav-back">← Back to Home</a>
</nav>

<main class="main">
  <div class="bg-dots"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>

  <div class="login-box">
    <p class="login-eyebrow">Student Portal</p>
    <h1 class="login-title">Welcome <em>Back</em></h1>
    <p class="login-sub">Sign in to access your courses, dashboard, and placement support.</p>

    <!-- Google Sign-In -->
    <button class="btn-google" id="googleBtn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or use email</span></div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Error / Success messages -->
    <div class="auth-msg auth-error" id="authError"></div>
    <div class="auth-msg auth-success" id="authSuccess"></div>

    <!-- Sign In Panel -->
    <div class="auth-panel active" id="panel-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" />
      </div>
      <button class="btn-submit" id="loginBtn" onclick="signIn()">Sign In →</button>
    </div>

    <!-- Sign Up Panel -->
    <div class="auth-panel" id="panel-signup">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters" />
      </div>
      <button class="btn-submit" id="signupBtn" onclick="signUp()">Create Account →</button>
    </div>

    <p class="login-footer">By signing in you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></p>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjgccsOgSsibd5Z3qxKa3api-tqDXwZY0",
    authDomain: "eduvance-academy.firebaseapp.com",
    projectId: "eduvance-academy",
    storageBucket: "eduvance-academy.firebasestorage.app",
    messagingSenderId: "1010713775139",
    appId: "1:1010713775139:web:7a6cffa2bc6ae4cc3e3596"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // redirect if already logged in
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = 'dashboard.html';
  });

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('authSuccess').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('authSuccess');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('authError').style.display = 'none';
  }

  async function saveUserToFirestore(user, name) {
    const ref = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        name: name || user.displayName || 'Student',
        email: user.email,
        createdAt: new Date().toISOString(),
        enrollments: []
      });
    }
  }

  // Google Sign-In
  document.getElementById('googleBtn').addEventListener('click', async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      await saveUserToFirestore(result.user, result.user.displayName);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message);
    }
  });

  // Email Sign-In
  window.signIn = async function() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Please enter your email and password.'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError('Invalid email or password. Please try again.');
      btn.disabled = false; btn.textContent = 'Sign In →';
    }
  };

  // Email Sign-Up
  window.signUp = async function() {
    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) { showError('Please fill in all fields.'); return; }
    if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
    const btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const result = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(result.user, { displayName: name });
      await saveUserToFirestore(result.user, name);
      showSuccess('Account created! Redirecting to your dashboard…');
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
    } catch (err) {
      if (err.code === 'auth/email-already-in-use') showError('This email is already registered. Try signing in.');
      else showError(err.message);
      btn.disabled = false; btn.textContent = 'Create Account →';
    }
  };

  // Tab switch
  window.switchTab = function(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('authError').style.display = 'none';
    document.getElementById('authSuccess').style.display = 'none';
  };

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('panel-login').classList.contains('active')) window.signIn();
      else window.signUp();
    }
  });
</script>
</body>
</html>
