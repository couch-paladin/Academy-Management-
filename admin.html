<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — EduVance Academy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a2e; --ink-mid: #2d2d4e; --ink-soft: #5a5a7a; --ink-muted: #9898b3;
      --accent: #c8a96e; --accent-dim: rgba(200,169,110,0.15);
      --surface: #faf9f7; --surface-2: #f2f0ec; --white: #ffffff;
      --border: #e4e0d8; --radius: 14px; --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(26,26,46,0.08); --shadow-lg: 0 12px 48px rgba(26,26,46,0.14);
      --green: #5dba72; --red: #d4705a; --blue: #5aacdc;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); min-height: 100vh; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(26,26,46,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(200,169,110,0.12); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: #fff; text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-badge { background: var(--accent); color: var(--ink); font-size: 10px; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 0.5rem; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { font-size: 13px; color: rgba(255,255,255,0.6); }
    .nav-user strong { color: var(--accent); }
    .btn-logout { background: transparent; border: 1.5px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 0.4rem 1rem; border-radius: 999px; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* LAYOUT */
    .admin-wrap { padding: 5rem 2rem 3rem; max-width: 1200px; margin: 0 auto; }

    /* ACCESS DENIED */
    .access-denied { display: none; text-align: center; padding: 5rem 2rem; }
    .access-denied .icon { font-size: 4rem; margin-bottom: 1rem; }
    .access-denied h2 { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--ink); margin-bottom: 0.75rem; }
    .access-denied p { font-size: 15px; color: var(--ink-soft); font-weight: 300; }

    /* LOADING */
    .loading { text-align: center; padding: 4rem; color: var(--ink-muted); font-size: 14px; }

    /* HEADER */
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .admin-title { font-family: 'DM Serif Display', serif; font-size: clamp(1.5rem, 3vw, 2rem); color: var(--ink); }
    .admin-title em { font-style: italic; color: var(--accent); }
    .admin-subtitle { font-size: 13.5px; color: var(--ink-soft); font-weight: 300; margin-top: 0.25rem; }
    .btn-refresh { background: var(--ink); color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 0.6rem 1.5rem; border-radius: 999px; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-refresh:hover { background: var(--ink-mid); transform: translateY(-1px); }

    /* STATS ROW */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; display: flex; align-items: center; gap: 1rem; transition: all 0.3s; }
    .stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .stat-icon.blue { background: rgba(90,172,220,0.12); }
    .stat-icon.green { background: rgba(93,186,114,0.12); }
    .stat-icon.gold { background: rgba(200,169,110,0.12); }
    .stat-icon.purple { background: rgba(150,100,220,0.12); }
    .stat-num { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--ink); line-height: 1; }
    .stat-label { font-size: 12.5px; color: var(--ink-soft); margin-top: 0.2rem; }

    /* TABS */
    .admin-tabs { display: flex; gap: 0.25rem; margin-bottom: 1.5rem; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.35rem; width: fit-content; }
    .admin-tab { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 0.5rem 1.25rem; border-radius: 10px; border: none; background: transparent; color: var(--ink-soft); cursor: pointer; transition: all 0.2s; }
    .admin-tab.active { background: var(--ink); color: var(--accent); font-weight: 600; }

    /* TABLE */
    .table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .table-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
    .table-title { font-size: 15px; font-weight: 600; color: var(--ink); }
    .table-count { font-size: 12px; color: var(--ink-muted); background: var(--surface-2); padding: 0.25rem 0.75rem; border-radius: 999px; }
    .search-input { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.85rem; transition: all 0.2s; width: 220px; }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); padding: 0.85rem 1.5rem; text-align: left; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { font-size: 13.5px; color: var(--ink); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface); }
    .badge { font-size: 11px; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 999px; white-space: nowrap; }
    .badge-paid { background: rgba(93,186,114,0.12); color: var(--green); border: 1px solid rgba(93,186,114,0.3); }
    .badge-pending { background: rgba(200,169,110,0.12); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }
    .badge-active { background: rgba(90,172,220,0.12); color: var(--blue); border: 1px solid rgba(90,172,220,0.3); }
    .empty-row td { text-align: center; color: var(--ink-muted); font-size: 14px; padding: 3rem; font-weight: 300; }

    /* STAR RATING */
    .stars { color: var(--accent); font-size: 13px; letter-spacing: 1px; }

    /* PANEL */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* REVENUE */
    .revenue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .revenue-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow); }
    .revenue-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--ink); margin-bottom: 1.25rem; }
    .course-revenue-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    .course-revenue-item:last-child { border-bottom: none; }
    .course-revenue-item .name { color: var(--ink); font-weight: 500; }
    .course-revenue-item .amount { color: var(--accent); font-family: 'DM Serif Display', serif; font-size: 1.1rem; }

    @media (max-width: 768px) {
      .revenue-grid { grid-template-columns: 1fr; }
      .admin-tabs { width: 100%; overflow-x: auto; }
      .search-input { width: 100%; }
    }
  </style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;">
    <a href="index.html" class="nav-logo">Edu<span>Vance</span></a>
    <span class="nav-badge">Admin</span>
  </div>
  <div class="nav-right">
    <span class="nav-user">Hello, <strong id="navName">Admin</strong></span>
    <button class="btn-logout" id="logoutBtn">Sign Out</button>
  </div>
</nav>

<div class="admin-wrap" id="adminContent">
  <div class="loading">Verifying admin access…</div>
</div>

<!-- ACCESS DENIED -->
<div class="access-denied" id="accessDenied">
  <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <h2>Access Denied</h2>
  <p>You don't have admin privileges. Contact your administrator.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjgccsOgSsibd5Z3qxKa3api-tqDXwZY0",
    authDomain: "eduvance-academy.firebaseapp.com",
    projectId: "eduvance-academy",
    storageBucket: "eduvance-academy.firebasestorage.app",
    messagingSenderId: "1010713775139",
    appId: "1:1010713775139:web:7a6cffa2bc6ae4cc3e3596"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let allUsers = [];
  let allFeedback = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }

    // Check admin role
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    const userData = userDoc.exists() ? userDoc.data() : {};

    if (!userData.role || userData.role.trim() !== 'admin') {
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('accessDenied').style.display = 'block';
      return;
    }

    const firstName = (user.displayName || 'Admin').split(' ')[0];
    document.getElementById('navName').textContent = firstName;

    await loadDashboard();
  });

  async function loadDashboard() {
    // Fetch all users
    const usersSnap = await getDocs(collection(db, 'users'));
    allUsers = [];
    usersSnap.forEach(doc => {
      allUsers.push({ id: doc.id, ...doc.data() });
    });

    // Fetch all feedback
    const feedbackSnap = await getDocs(collection(db, 'feedback'));
    allFeedback = [];
    feedbackSnap.forEach(doc => {
      allFeedback.push({ id: doc.id, ...doc.data() });
    });

    // Calculate stats
    const totalStudents = allUsers.filter(u => u.role !== 'admin').length;
    const allEnrollments = allUsers.flatMap(u => u.enrollments || []);
    const totalEnrollments = allEnrollments.length;
    const paidEnrollments = allEnrollments.filter(e => e.status === 'Paid');
    const totalRevenue = paidEnrollments.reduce((sum, e) => sum + (parseInt(e.price) || 0), 0);
    const avgRating = allFeedback.length > 0
      ? (allFeedback.reduce((sum, f) => sum + (parseInt(f.ratings?.r_overall) || 0), 0) / allFeedback.length).toFixed(1)
      : 'N/A';

    // Revenue by course
    const courseRevenue = {};
    paidEnrollments.forEach(e => {
      if (!courseRevenue[e.program]) courseRevenue[e.program] = 0;
      courseRevenue[e.program] += parseInt(e.price) || 0;
    });

    document.getElementById('adminContent').innerHTML = `
      <div class="admin-header">
        <div>
          <h1 class="admin-title">Admin <em>Dashboard</em></h1>
          <p class="admin-subtitle">Manage students, enrollments, feedback and revenue</p>
        </div>
        <button class="btn-refresh" onclick="location.reload()">↻ Refresh</button>
      </div>

      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div><div class="stat-num">${totalStudents}</div><div class="stat-label">Total Students</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
          <div><div class="stat-num">${totalEnrollments}</div><div class="stat-label">Total Enrollments</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon gold">₹</div>
          <div><div class="stat-num">₹${totalRevenue.toLocaleString('en-IN')}</div><div class="stat-label">Total Revenue</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
          <div><div class="stat-num">${avgRating}</div><div class="stat-label">Avg Rating</div></div>
        </div>
      </div>

      <!-- TABS -->
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchTab('students', this)">Students</button>
        <button class="admin-tab" onclick="switchTab('enrollments', this)">Enrollments</button>
        <button class="admin-tab" onclick="switchTab('feedback', this)">Feedback</button>
        <button class="admin-tab" onclick="switchTab('revenue', this)">Revenue</button>
      </div>

      <!-- STUDENTS TAB -->
      <div class="tab-panel active" id="tab-students">
        <div class="table-card">
          <div class="table-header">
            <div class="table-title">All Students <span class="table-count">${totalStudents}</span></div>
            <input class="search-input" placeholder="Search by name or email…" oninput="filterTable('students-table', this.value)" />
          </div>
          <div class="table-wrap">
            <table id="students-table">
              <thead><tr>
                <th>Name</th><th>Email</th><th>Enrolled</th><th>Member Since</th><th>Status</th>
              </tr></thead>
              <tbody>
                ${allUsers.filter(u => u.role !== 'admin').map(u => `
                  <tr>
                    <td><strong>${u.name || '—'}</strong></td>
                    <td>${u.email || '—'}</td>
                    <td>${(u.enrollments || []).length}</td>
                    <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '—'}</td>
                    <td><span class="badge badge-active">Active</span></td>
                  </tr>
                `).join('') || '<tr class="empty-row"><td colspan="5">No students yet</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ENROLLMENTS TAB -->
      <div class="tab-panel" id="tab-enrollments">
        <div class="table-card">
          <div class="table-header">
            <div class="table-title">All Enrollments <span class="table-count">${totalEnrollments}</span></div>
            <input class="search-input" placeholder="Search by course or student…" oninput="filterTable('enrollments-table', this.value)" />
          </div>
          <div class="table-wrap">
            <table id="enrollments-table">
              <thead><tr>
                <th>Student</th><th>Course</th><th>Type</th><th>Mode</th><th>Date</th><th>Price</th><th>Status</th>
              </tr></thead>
              <tbody>
                ${allUsers.flatMap(u => (u.enrollments || []).map(e => ({...e, studentName: u.name, studentEmail: u.email}))).map(e => `
                  <tr>
                    <td><strong>${e.studentName || '—'}</strong><br/><span style="font-size:12px;color:var(--ink-muted)">${e.studentEmail || ''}</span></td>
                    <td>${e.program || '—'}</td>
                    <td>${e.type || '—'}</td>
                    <td>${e.mode || '—'}</td>
                    <td>${e.date || '—'}</td>
                    <td>${parseInt(e.price) > 0 ? '₹' + parseInt(e.price).toLocaleString('en-IN') : 'Free'}</td>
                    <td><span class="badge ${e.status === 'Paid' ? 'badge-paid' : 'badge-pending'}">${e.status || 'Pending'}</span></td>
                  </tr>
                `).join('') || '<tr class="empty-row"><td colspan="7">No enrollments yet</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- FEEDBACK TAB -->
      <div class="tab-panel" id="tab-feedback">
        <div class="table-card">
          <div class="table-header">
            <div class="table-title">All Feedback <span class="table-count">${allFeedback.length}</span></div>
            <input class="search-input" placeholder="Search by name or course…" oninput="filterTable('feedback-table', this.value)" />
          </div>
          <div class="table-wrap">
            <table id="feedback-table">
              <thead><tr>
                <th>Student</th><th>Course</th><th>Overall</th><th>Recommend</th><th>Comments</th><th>Date</th>
              </tr></thead>
              <tbody>
                ${allFeedback.map(f => `
                  <tr>
                    <td><strong>${f.student_name || '—'}</strong><br/><span style="font-size:12px;color:var(--ink-muted)">${f.email || ''}</span></td>
                    <td>${f.course || '—'}</td>
                    <td><span class="stars">${'★'.repeat(parseInt(f.ratings?.r_overall) || 0)}${'☆'.repeat(5 - (parseInt(f.ratings?.r_overall) || 0))}</span> ${f.ratings?.r_overall || '—'}/5</td>
                    <td>${f.recommend || '—'}</td>
                    <td style="max-width:200px;font-size:12.5px;color:var(--ink-soft)">${f.comments || '—'}</td>
                    <td>${f.submittedAt ? new Date(f.submittedAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '—'}</td>
                  </tr>
                `).join('') || '<tr class="empty-row"><td colspan="6">No feedback yet</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- REVENUE TAB -->
      <div class="tab-panel" id="tab-revenue">
        <div class="revenue-grid">
          <div class="revenue-card">
            <h3>Revenue by Course</h3>
            ${Object.keys(courseRevenue).length > 0
              ? Object.entries(courseRevenue).sort((a,b) => b[1]-a[1]).map(([course, rev]) => `
                <div class="course-revenue-item">
                  <span class="name">${course}</span>
                  <span class="amount">₹${rev.toLocaleString('en-IN')}</span>
                </div>
              `).join('')
              : '<p style="color:var(--ink-muted);font-size:13.5px;font-weight:300">No paid enrollments yet</p>'
            }
          </div>
          <div class="revenue-card">
            <h3>Revenue Summary</h3>
            <div class="course-revenue-item"><span class="name">Total Enrollments</span><span style="font-weight:600">${totalEnrollments}</span></div>
            <div class="course-revenue-item"><span class="name">Paid Enrollments</span><span style="font-weight:600">${paidEnrollments.length}</span></div>
            <div class="course-revenue-item"><span class="name">Free Enrollments</span><span style="font-weight:600">${totalEnrollments - paidEnrollments.length}</span></div>
            <div class="course-revenue-item"><span class="name">Total Revenue</span><span class="amount">₹${totalRevenue.toLocaleString('en-IN')}</span></div>
            <div class="course-revenue-item"><span class="name">Avg per Enrollment</span><span class="amount">${paidEnrollments.length > 0 ? '₹' + Math.round(totalRevenue/paidEnrollments.length).toLocaleString('en-IN') : '—'}</span></div>
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    sessionStorage.removeItem('dashAnimShown');
    await signOut(auth);
    window.location.href = 'index.html';
  });

  window.switchTab = function(tab, btn) {
    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  };

  window.filterTable = function(tableId, query) {
    const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
    });
  };
</script>
</body>
</html>
