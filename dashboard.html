<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — EduVance Academy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a2e; --ink-mid: #2d2d4e; --ink-soft: #5a5a7a; --ink-muted: #9898b3;
      --accent: #c8a96e; --accent-dim: rgba(200,169,110,0.15);
      --surface: #faf9f7; --surface-2: #f2f0ec; --white: #ffffff;
      --border: #e4e0d8; --radius: 14px; --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(26,26,46,0.08); --shadow-lg: 0 12px 48px rgba(26,26,46,0.14);
      --green: #5dba72;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); overflow-x: hidden; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(26,26,46,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(200,169,110,0.12); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: #fff; text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; list-style: none; }
    .nav-links a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 13px; font-weight: 500; padding: 0.4rem 0.65rem; border-radius: 6px; transition: all 0.2s; letter-spacing: 0.01em; }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .nav-links a.active { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .nav-hamburger span { width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: all 0.3s; }
    .nav-user { font-size: 13px; color: rgba(255,255,255,0.6); }
    .nav-user strong { color: var(--accent); }
    .btn-logout { background: transparent; border: 1.5px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 0.4rem 1rem; border-radius: 999px; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* LAYOUT */
    .dashboard { padding: 5rem 2rem 3rem; max-width: 1100px; margin: 0 auto; }

    /* Welcome banner */
    .welcome-banner { background: var(--ink); border-radius: var(--radius); padding: 2rem 2.5rem; margin-bottom: 2rem; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
    .welcome-banner::after { content: ''; position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; border-radius: 50%; border: 1px solid rgba(200,169,110,0.1); }
    .welcome-eyebrow { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 0.4rem; }
    .welcome-name { font-family: 'DM Serif Display', serif; font-size: clamp(1.4rem, 3vw, 2rem); color: #fff; margin-bottom: 0.4rem; }
    .welcome-name em { font-style: italic; color: var(--accent); }
    .welcome-sub { font-size: 13.5px; color: rgba(255,255,255,0.45); font-weight: 300; }
    .welcome-avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(200,169,110,0.15); border: 2px solid rgba(200,169,110,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; flex-shrink: 0; position: relative; z-index: 1; overflow: hidden; }
    .welcome-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; text-align: center; transition: all 0.3s; }
    .stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: rgba(200,169,110,0.3); }
    .stat-num { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--accent); display: block; line-height: 1; }
    .stat-label { font-size: 12.5px; color: var(--ink-soft); margin-top: 0.4rem; }

    /* Grid */
    .dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 1.5rem; }

    /* Section card */
    .section-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow); }
    .section-card h2 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--ink); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-card h2 .badge { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); padding: 0.15rem 0.55rem; border-radius: 999px; }

    /* Enrollment items */
    .enrollment-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border); }
    .enrollment-item:last-child { border-bottom: none; padding-bottom: 0; }
    .enroll-icon { width: 44px; height: 44px; background: var(--ink); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; }
    .enroll-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 0.2rem; }
    .enroll-meta { font-size: 12px; color: var(--ink-muted); }
    .enroll-status { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 999px; white-space: nowrap; }
    .status-active { background: rgba(93,186,114,0.12); color: var(--green); border: 1px solid rgba(93,186,114,0.3); }
    .status-pending { background: rgba(200,169,110,0.12); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }

    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--ink-muted); }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
    .empty-state p { font-size: 13.5px; font-weight: 300; line-height: 1.6; margin-bottom: 1rem; }
    .btn-browse { background: var(--accent); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 0.6rem 1.5rem; border-radius: 999px; border: none; cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.2s; }
    .btn-browse:hover { background: #d4b87a; transform: translateY(-1px); }

    /* Quick links */
    .quick-link-item { display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; transition: all 0.2s; }
    .quick-link-item:last-child { border-bottom: none; }
    .quick-link-item:hover { color: var(--accent); }
    .ql-icon { width: 36px; height: 36px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .ql-text { font-size: 13.5px; font-weight: 500; }
    .ql-arrow { margin-left: auto; color: var(--ink-muted); font-size: 1rem; }

    /* Profile card */
    .profile-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    .profile-row:last-child { border-bottom: none; }
    .profile-label { color: var(--ink-muted); min-width: 80px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .profile-val { color: var(--ink); font-weight: 500; }

    /* Loading */
    .loading { text-align: center; padding: 3rem; color: var(--ink-muted); font-size: 14px; }

    @media (max-width: 768px) {
      .nav-links { display: none; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0; background: var(--ink); padding: 1.5rem; gap: 0.25rem; border-bottom: 1px solid rgba(200,169,110,0.12); }
      .nav-links.open { display: flex; }
      .nav-hamburger { display: flex; }
    }
    @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .welcome-banner { flex-direction: column; align-items: flex-start; } }

    /* ══ WELCOME ANIMATION ON DASHBOARD ══ */
    #phase1 { position: fixed; inset: 0; z-index: 9000; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease; }
    #phase1.active { opacity: 1; visibility: visible; }
    #phase1.out { opacity: 0; visibility: hidden; }
    .p1-logo { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: #fff; margin-bottom: 3rem; }
    .p1-logo span { color: var(--accent); }
    .p1-spinner { width: 52px; height: 52px; border: 3px solid rgba(200,169,110,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.85s linear infinite; margin-bottom: 2rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .p1-label { font-size: 13px; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; margin-bottom: 1.75rem; text-align: center; min-height: 20px; transition: opacity 0.25s; }
    .p1-bar-wrap { width: 260px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    .p1-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #e8c98a); border-radius: 999px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

    #phase2 { position: fixed; inset: 0; z-index: 9001; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
    #phase2.active { opacity: 1; visibility: visible; }
    #phase2.out { opacity: 0; visibility: hidden; }
    .p2-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(200,169,110,0.08); pointer-events: none; }
    .p2-ring:nth-child(1) { width: 500px; height: 500px; top: -100px; right: -100px; }
    .p2-ring:nth-child(2) { width: 300px; height: 300px; bottom: -60px; left: -60px; }
    .p2-ring:nth-child(3) { width: 180px; height: 180px; top: 30%; left: 8%; }
    .p2-content { position: relative; z-index: 1; text-align: center; padding: 2rem; }
    .p2-avatar { width: 84px; height: 84px; border-radius: 50%; background: rgba(200,169,110,0.12); border: 2px solid rgba(200,169,110,0.35); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 2rem; overflow: hidden; opacity: 0; transform: scale(0.4); transition: opacity 0.6s cubic-bezier(.34,1.56,.64,1) 0.2s, transform 0.6s cubic-bezier(.34,1.56,.64,1) 0.2s; }
    #phase2.active .p2-avatar { opacity: 1; transform: scale(1); }
    .p2-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .p2-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 0.75rem; opacity: 0; transform: translateY(18px); transition: opacity 0.5s ease 0.4s, transform 0.5s ease 0.4s; }
    #phase2.active .p2-eyebrow { opacity: 1; transform: translateY(0); }
    .p2-heading { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 7vw, 3.8rem); color: #fff; line-height: 1.15; margin-bottom: 0.5rem; opacity: 0; transform: translateY(28px); transition: opacity 0.6s ease 0.55s, transform 0.6s ease 0.55s; }
    .p2-heading em { color: var(--accent); font-style: italic; }
    #phase2.active .p2-heading { opacity: 1; transform: translateY(0); }
    .p2-sub { font-size: 15px; color: rgba(255,255,255,0.45); font-weight: 300; margin-bottom: 2.5rem; opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease 0.7s, transform 0.5s ease 0.7s; }
    #phase2.active .p2-sub { opacity: 1; transform: translateY(0); }
    .p2-dots { display: flex; gap: 0.6rem; justify-content: center; opacity: 0; transition: opacity 0.5s ease 0.85s; }
    #phase2.active .p2-dots { opacity: 1; }
    .p2-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(200,169,110,0.25); animation: dotbeat 1.5s ease-in-out infinite; }
    .p2-dot:nth-child(2) { animation-delay: 0.25s; }
    .p2-dot:nth-child(3) { animation-delay: 0.5s; }
    @keyframes dotbeat { 0%,80%,100% { background: rgba(200,169,110,0.25); transform: scale(1); } 40% { background: var(--accent); transform: scale(1.4); } }
    .p2-line { width: 0; height: 2px; margin: 2rem auto 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); border-radius: 999px; transition: width 1s ease 0.6s; }
    #phase2.active .p2-line { width: 220px; }
  </style>
</head>

<!-- WELCOME ANIMATION -->
<div id="phase1">

    <h1 class="p2-heading" id="p2Heading">Welcome Back,<br/><em>Student</em>!</h1>

    <div class="p2-line"></div>

<script>

  function runDashboardAnimation(name, photoURL, isNewUser) {
    var firstName = (name || 'Student').split(' ')[0];
    var p1 = document.getElementById('phase1');
    var p2 = document.getElementById('phase2');
    var p1Bar = document.getElementById('p1Bar');
    var p1Label = document.getElementById('p1Label');
    var p2Head = document.getElementById('p2Heading');
    var p2Sub = document.getElementById('p2Sub');
    var p2Av = document.getElementById('p2Avatar');

    if (isNewUser) {
      p2Head.innerHTML = 'Welcome, <em>' + firstName + '</em>! 🎉';
      p2Sub.textContent = "You're all set. Let's start learning! 🚀";
    } else {
      p2Head.innerHTML = 'Welcome Back,<br/><em>' + firstName + '</em>!';
      p2Sub.textContent = "Your dashboard is ready. Let's go! 🚀";
    }
    if (photoURL) {
      p2Av.innerHTML = '<img src="' + photoURL + '" alt="' + firstName + '" />';
    }

    p1.classList.add('active');
    var steps = [
      { label: 'Verifying your identity…',  pct: 20,  t: 0    },
      { label: 'Loading your profile…',      pct: 45,  t: 700  },
      { label: 'Fetching your courses…',     pct: 68,  t: 1300 },
      { label: 'Preparing your dashboard…',  pct: 88,  t: 1900 },
      { label: 'Almost ready!',              pct: 100, t: 2400 },
    ];
    steps.forEach(function(s) {
      setTimeout(function() {
        p1Label.style.opacity = '0';
        setTimeout(function() {
          p1Label.textContent = s.label;
          p1Label.style.opacity = '1';
          p1Bar.style.width = s.pct + '%';
        }, 150);
      }, s.t);
    });

    setTimeout(function() {
      p1.classList.add('out');
      setTimeout(function() {
        p1.classList.remove('active', 'out');
        p2.classList.add('active');
        setTimeout(function() {
          p2.classList.add('out');
          setTimeout(function() {
            p2.classList.remove('active', 'out');
          }, 500);
        }, 3000);
      }, 450);
    }, 2900);
  }

  function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-links a').forEach(a => {
      a.addEventListener('click', () => document.getElementById('navLinks').classList.remove('open'));
    });
  });
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjgccsOgSsibd5Z3qxKa3api-tqDXwZY0",
    authDomain: "eduvance-academy.firebaseapp.com",
    projectId: "eduvance-academy",
    storageBucket: "eduvance-academy.firebasestorage.app",
    messagingSenderId: "1010713775139",
    appId: "1:1010713775139:web:7a6cffa2bc6ae4cc3e3596"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);


  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    const firstName = (user.displayName || 'Student').split(' ')[0];
    document.getElementById('navName').textContent = firstName;

    // Play animation once per session
    const shown = sessionStorage.getItem('dashAnimShown');
    if (!shown) {
      sessionStorage.setItem('dashAnimShown', '1');
      const isNew = sessionStorage.getItem('isNewUser') === '1';
      sessionStorage.removeItem('isNewUser');
      runDashboardAnimation(user.displayName || firstName, user.photoURL, isNew);
    }

    // Get Firestore data
    const snap = await getDoc(doc(db, 'users', user.uid));
    const data = snap.exists() ? snap.data() : {};
    const enrollments = data.enrollments || [];

    // Render dashboard
    document.getElementById('dashContent').innerHTML = `
      <div class="welcome-banner">
        <div>
          <p class="welcome-eyebrow">Student Dashboard</p>
          <h1 class="welcome-name">Hello, <em>${firstName}!</em></h1>
          <p class="welcome-sub">Welcome to your EduVance learning hub.</p>
        </div>
        <div class="welcome-avatar">
          ${user.photoURL ? `<img src="${user.photoURL}" alt="${firstName}" />` : '🎓'}
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-num">${enrollments.length}</span>
          <span class="stat-label">Enrolled Programs</span>
        </div>
        <div class="stat-card">
          <span class="stat-num">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-num">0</span>
          <span class="stat-label">Certificates</span>
        </div>
      </div>

      <div class="dash-grid">
        <div>
          <div class="section-card" style="margin-bottom:1.5rem;">
            <h2>My Enrollments <span class="badge">${enrollments.length}</span></h2>
            ${enrollments.length === 0 ? `
              <div class="empty-state">
                <span class="empty-icon">📚</span>
                <p>You haven't enrolled in any programs yet. Browse our courses and get started!</p>
                <a href="courses.html" class="btn-browse">Browse Courses →</a>
              </div>
            ` : enrollments.map(e => `
              <div class="enrollment-item">
                <div class="enroll-icon">📘</div>
                <div>
                  <p class="enroll-title">${e.program || 'Program'}</p>
                  <p class="enroll-meta">${e.type || 'Course'} · Enrolled ${e.date || ''}</p>
                </div>
                <span class="enroll-status status-active">Active</span>
              </div>
            `).join('')}
          </div>

          <div class="section-card">
            <h2>My Profile</h2>
            <div class="profile-row"><span class="profile-label">Name</span><span class="profile-val">${user.displayName || data.name || '—'}</span></div>
            <div class="profile-row"><span class="profile-label">Email</span><span class="profile-val">${user.email}</span></div>
            <div class="profile-row"><span class="profile-label">Member since</span><span class="profile-val">${data.createdAt ? new Date(data.createdAt).toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'}) : '—'}</span></div>
          </div>
        </div>

        <div>
          <div class="section-card">
            <h2>Quick Links</h2>
