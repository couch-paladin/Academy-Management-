name: Deploy to AWS Amplify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy EduVance to Amplify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger Amplify deployment
        run: |
          aws amplify start-job \
            --app-id ${{ secrets.AWS_APP_ID }} \
            --branch-name main \
            --job-type RELEASE

      - name: Wait for deployment
        run: |
          echo "Deployment triggered successfully!"
          echo "Check status at: https://ap-southeast-2.console.aws.amazon.com/amplify/home"

      - name: Notify success
        run: |
          echo "✅ EduVance deployed successfully to AWS Amplify!"
          echo "🌐 Live at: https://main.dc7hjd4bn6ptw.amplifyapp.com"
