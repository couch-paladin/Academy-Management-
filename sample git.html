<!DOCTYPE html>
<head>
  <title>Sample</title>
</head>
<body>
  <h1>Seminar Feedback Form</h1>
  <label>Name:</label>
  <input type="text" placeholder="Enter your name"><br><br>
  <label>Institution:<label>
  <input type="text" placeholder="Enter the name of your institution"><br><br>
  <label>Department:</label>
  <select name="dept" id="dept">
    <option>--Choose your Department--</option>
    <option>CSE</option>
    <option>IT</option>
    <option>CYBER</option>
    <option>AIDS</option>
    <option>CSD</option>
    <option>AIML</option>
    </select><br><br>
  <label>Year Of Study:<label>
  <select name="year" id="year">
    <option>--Choose your Year of Study--</option>
    <option> I </option>
    <option> II </option>
    <option> III </option>
    <option> IV </option>
  </select>
  <label>Seminar Topic:</label>
  <input type="text" placeholder="Enter seminar topic"><br><br>
  <label>Presenter Name:</label>
  <input type="text" placeholder="Enter presenter's name"><br><br>

  <p>Please rate the seminar presenter on the following aspects. Select a score from 1 (Poor) to 5 (Excellent) for each question.</p>
  <form action="seminar feedback" method="post">
      <legend><strong>1. How clear and audible was the presenter's voice throughout the seminar?</strong></legend><br>
      <label><input type="radio" name="q1" value="1" required />1-Poor</label>
      <label><input type="radio" name="q1" value="2" /> 2-Below Average</label>
      <label><input type="radio" name="q1" value="3" /> 3-Average</label>
      <label><input type="radio" name="q1" value="4" /> 4-Good</label>
      <label><input type="radio" name="q1" value="5" /> 5- Excellent</label><br><br>

       <legend><strong>2. How crisp and easy to understand were the presenter's explanations?</strong></legend><br>
      <label><input type="radio" name="q2" value="1" required />1-Poor</label>
      <label><input type="radio" name="q2" value="2" /> 2-Below Average</label>
      <label><input type="radio" name="q2" value="3" /> 3-Average</label>
      <label><input type="radio" name="q2" value="4" /> 4-Good</label>
      <label><input type="radio" name="q2" value="5" /> 5-Excellent</label><br><br>

      <legend><strong>3. How effectively did the presenter use interactive visual or audio elements?</strong></legend>
      <br />
      <label><input type="radio" name="q3" value="1" required /> 1-Poor</label>
      <label><input type="radio" name="q3" value="2" /> 2-Below Average</label>
      <label><input type="radio" name="q3" value="3" /> 3-Average</label>
      <label><input type="radio" name="q3" value="4" /> 4-Good</label>
      <label><input type="radio" name="q3" value="5" /> 5-Excellent</label><br><br>

      <legend><strong>4. How engaging and interactive was the overall seminar session?</strong></legend><br>
      <label><input type="radio" name="q4" value="1" required /> 1-Poor</label>
      <label><input type="radio" name="q4" value="2" /> 2-Below Average</label>
      <label><input type="radio" name="q4" value="3" /> 3-Average</label>
      <label><input type="radio" name="q4" value="4" /> 4-Good</label>
      <label><input type="radio" name="q4" value="5" /> 5-Excellent</label><br><br>

      <legend><strong>5. How well-prepared and organised was the seminar material?</strong></legend>
      <br />
      <label><input type="radio" name="q5" value="1" required /> 1-Poor</label>
      <label><input type="radio" name="q5" value="2" /> 2-Below Average</label>
      <label><input type="radio" name="q5" value="3" /> 3-Average</label>
      <label><input type="radio" name="q5" value="4" /> 4-Good</label>
      <label><input type="radio" name="q5" value="5" /> 5-Excellent</label><br><br>

    <p><strong>Additional Suggestions or Feedback:</strong></p>
    <p>Feel free to share any comments, suggestions, or feedback about the seminar below!</p>
    <textarea name="suggestions" rows="6" cols="60" placeholder=""></textarea><br><br>
    <input type="submit" value="Submit Feedback">
    <input type="reset" value="Clear Form">

  </form>

  <p>Thank you for your valuable feedback. Happyy Learning!!!.</p>

</body>
</html>
